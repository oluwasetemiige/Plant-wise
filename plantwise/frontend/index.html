<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlantWise</title>
<link rel="stylesheet" href="css/style.css">
</head><body>
<div id="splash">
<svg class="fld" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".3" stop-color="#153B2E" stop-opacity="0"/><stop offset=".78" stop-color="#153B2E" stop-opacity=".97"/></linearGradient></defs>
<g transform="rotate(-18 200 400)">
<rect x="-150" y="-150" width="700" height="1100" fill="#3E7A3B"/>
<rect x="-150" y="0" width="700" height="70" fill="#5B9A45"/><rect x="-150" y="90" width="700" height="60" fill="#2F6B3A"/>
<rect x="-150" y="170" width="700" height="80" fill="#7DB84E"/><rect x="-150" y="270" width="700" height="50" fill="#4C8C42"/>
<rect x="120" y="340" width="400" height="95" fill="#D79A3C"/><rect x="-150" y="340" width="260" height="95" fill="#6FA84A"/>
<rect x="-150" y="455" width="700" height="60" fill="#3B7B3D"/><rect x="-150" y="535" width="700" height="80" fill="#6FA84A"/>
<rect x="-150" y="635" width="700" height="60" fill="#2F6B3A"/><rect x="-150" y="715" width="700" height="90" fill="#5B9A45"/>
</g>
<g fill="#1E4D2B" opacity=".92"><circle cx="64" cy="110" r="46"/><circle cx="118" cy="72" r="36"/><circle cx="36" cy="182" r="34"/><circle cx="338" cy="470" r="30"/></g>
<rect width="400" height="800" fill="url(#fade)"/>
</svg>
<div class="sp">
<h1>KNOW WHEN<br>TO PLANT.</h1>
<p>Hyperlocal weather advice for Nigerian farmers, in your own language.</p>
<button class="go" onclick="start()"><span class="ar">&rarr;</span><b>Get Started</b><span class="ch">&raquo;</span></button>
</div>
</div>

<div id="app">
<header>
<div><small>Welcome back</small><h1>PlantWise</h1></div>
<div class="hr"><span class="badge" id="bd"></span>
<button class="wxbtn" onclick="openWx()" aria-label="Weather in Nigeria" title="Weather in Nigeria"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="7.5" r="3"/><path d="M7.5 1.5v1.2M1.5 7.5h1.2M3.3 3.3l.9.9M11.7 3.3l-.9.9"/><path d="M9 21h9a4 4 0 0 0 .6-7.95 5.5 5.5 0 0 0-10.4 1.2A3.4 3.4 0 0 0 9 21z"/></svg></button></div>
</header>
<main id="m"></main>
<nav>
<button data-t="today" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
<button data-t="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Week</button>
<button data-t="ore" class="mid" aria-label="Ask Ore"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button>
<button data-t="crops"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 7 8 4 3 4c0 5 3 8 9 8z"/><path d="M12 14c0-4 3-7 9-7 0 5-3 7-9 7z"/></svg>Crops</button>
<button data-t="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</button>
</nav>
</div>

<div id="wx" hidden onclick="if(event.target==this)closeWx()"><div class="sheet" role="dialog" aria-label="Weather in Nigeria">
<div class="sh"><h2>Weather in Nigeria</h2><button onclick="closeWx()" aria-label="Close">&times;</button></div>
<label for="wxc">Choose a location</label><select id="wxc" onchange="loadWx()"></select>
<div id="wxb"></div></div></div>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body></html>
